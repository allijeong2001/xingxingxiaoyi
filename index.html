<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Love Note</title>
<link rel="stylesheet" href="style.css?v=v3">
</head>
<body>

<!-- 漂浮装饰：爱心与星光 -->
<div class="float-deco" id="floatDeco"></div>

<div class="page">

  <div class="home-head">
    <div class="home-names" id="homeNames"></div>
    <div><span class="home-lovenote" id="homeLoveNote"></span></div>
    <div class="home-slogan" id="homeSlogan"></div>
  </div>

  <!-- 三个爱心入口 -->
  <div class="hearts" id="hearts"></div>

  <div class="home-footer" id="homeFooter">♡ made with love ♡</div>
</div>

<script src="config.js"></script>
<script src="player.js?v=v3"></script>
<script>
(function () {
  var g = SITE_CONFIG.global;
  var home = SITE_CONFIG.home;

  /* 应用全局配色 */
  document.documentElement.style.setProperty('--grad-from', g.gradientFrom);
  document.documentElement.style.setProperty('--grad-to', g.gradientTo);
  document.documentElement.style.setProperty('--text-color', g.textColor);
  document.title = g.siteTitle;

  /* 主页文案 */
  document.getElementById('homeNames').textContent = g.coupleNames;
  document.getElementById('homeLoveNote').textContent = g.loveNoteText;
  document.getElementById('homeSlogan').textContent = g.slogan;

  /* 渲染三个爱心入口 */
  var heartsBox = document.getElementById('hearts');
  home.hearts.forEach(function (h) {
    var item = document.createElement('div');
    item.className = 'heart-item';

    var btn = document.createElement('a');
    btn.className = 'heart-btn';
    btn.href = h.url || '#';
    btn.style.setProperty('--heart-color', h.color);
    btn.innerHTML =
      '<span class="shape"></span>' +
      '<span class="heart-content">' +
        '<span class="heart-icon">' + h.icon + '</span>' +
        '<span class="heart-label">' + escapeHtml(h.label) + '</span>' +
      '</span>';

    var sub = document.createElement('div');
    sub.className = 'heart-sub';
    sub.textContent = h.subLabel || '';

    item.appendChild(btn);
    item.appendChild(sub);
    heartsBox.appendChild(item);
  });

  /* 漂浮装饰 */
  var deco = document.getElementById('floatDeco');
  var symbols = ['⭐', '🍋', '✨', '🌟', '🍬', '💫'];
  for (var i = 0; i < 14; i++) {
    var s = document.createElement('span');
    s.textContent = symbols[i % symbols.length];
    s.style.left = (Math.random() * 100) + '%';
    s.style.fontSize = (12 + Math.random() * 16) + 'px';
    s.style.animationDuration = (9 + Math.random() * 14) + 's';
    s.style.animationDelay = (-Math.random() * 16) + 's';
    deco.appendChild(s);
  }

  function escapeHtml(str) {
    return String(str == null ? '' : str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
})();
</script>
</body>
</html>
