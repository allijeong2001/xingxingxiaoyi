<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>陪伴学习</title>
<link rel="stylesheet" href="style.css?v=orig">
</head>
<body>

<div class="float-deco" id="floatDeco"></div>

<div class="page">

  <header class="topbar">
    <a class="back-btn" href="index.html" aria-label="返回主页">←</a>
    <span class="topbar-title" id="pageTitle"></span>
  </header>

  <div class="timer-stage">

    <!-- 圆形进度环 -->
    <div class="timer-ring-wrap">
      <svg width="250" height="250" viewBox="0 0 250 250">
        <circle class="timer-ring-bg" cx="125" cy="125" r="108"></circle>
        <circle class="timer-ring-fg" id="ringFg" cx="125" cy="125" r="108"></circle>
      </svg>
      <div class="timer-center">
        <div class="timer-emoji" id="timerEmoji">📚</div>
        <div class="timer-phase" id="timerPhase"></div>
        <div class="timer-time" id="timerTime">25:00</div>
      </div>
    </div>

    <!-- 控制按钮 -->
    <div class="timer-controls">
      <button class="timer-btn primary" id="startBtn"></button>
      <button class="timer-btn plain" id="resetBtn"></button>
    </div>

    <!-- 鼓励语气泡（专注期随机出现一次，持续显示几分钟后消失） -->
    <div class="encourage-bubble hide" id="encourageBubble">
      <span class="encourage-heart">💗</span><span id="encourageText"></span>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="player.js?v=orig"></script>
<script>
(function () {
  var g = SITE_CONFIG.global;
  var t = SITE_CONFIG.timer;

  /* 应用全局配色 */
  var root = document.documentElement;
  root.style.setProperty('--grad-from', g.gradientFrom);
  root.style.setProperty('--grad-to', g.gradientTo);
  root.style.setProperty('--text-color', g.textColor);
  document.title = g.siteTitle + ' · ' + t.pageTitle;

  document.getElementById('pageTitle').textContent = t.pageTitle;
  document.getElementById('startBtn').textContent = t.startButtonText;
  document.getElementById('resetBtn').textContent = t.resetButtonText;
  document.getElementById('timerPhase').textContent = t.focusText;

  var FOCUS_SEC = (Number(t.focusMinutes) || 25) * 60;
  var BREAK_SEC = (Number(t.breakMinutes) || 5) * 60;

  var PHASE = { IDLE: 'idle', FOCUS: 'focus', BREAK: 'break' };

  var phase = PHASE.IDLE;
  var running = false;
  var remain = FOCUS_SEC;
  var elapsed = 0;                 // 当前周期已经过的秒数（暂停时不增长）
  var encourageTarget = -1;        // 鼓励语出现的时间点（秒）
  var encourageShown = false;
  var encourageHideAt = -1;        // 鼓励语消失的时间点（秒）

  var ring = document.getElementById('ringFg');
  var R = 108;
  var CIRC = 2 * Math.PI * R;
  ring.style.strokeDasharray = CIRC;
  ring.style.strokeDashoffset = 0;

  var timeEl = document.getElementById('timerTime');
  var phaseEl = document.getElementById('timerPhase');
  var emojiEl = document.getElementById('timerEmoji');
  var startBtn = document.getElementById('startBtn');
  var resetBtn = document.getElementById('resetBtn');
  var bubble = document.getElementById('encourageBubble');
  var bubbleText = document.getElementById('encourageText');

  var tick = null;

  /* ---------- 渲染 ---------- */
  function fmt(sec) {
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec / 60), s = sec % 60;
    return (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
  }

  function render() {
    timeEl.textContent = fmt(remain);
    var total = (phase === PHASE.BREAK) ? BREAK_SEC : FOCUS_SEC;
    var progress = total ? (total - remain) / total : 0;
    ring.style.strokeDashoffset = CIRC * (1 - progress);
  }

  function setPhase(p) {
    phase = p;
    if (p === PHASE.FOCUS) {
      remain = FOCUS_SEC;
      emojiEl.textContent = '📚';
      phaseEl.textContent = t.focusText;
    } else if (p === PHASE.BREAK) {
      remain = BREAK_SEC;
      emojiEl.textContent = '🍵';
      phaseEl.textContent = t.breakText;
    } else {
      remain = FOCUS_SEC;
      emojiEl.textContent = '📚';
      phaseEl.textContent = t.focusText;
    }
    render();
  }

  /* ---------- 鼓励语逻辑 ----------
   * 每个专注周期内随机出现一条：
   * 出现时间点 = 专注开始后 [encourageShowAfterMin, encourageShowBeforeMin] 分钟内的随机秒数
   * 弹出后持续 encourageDurationMin 分钟再消失
   * 暂停时计时停止，鼓励语的显示与消失也随之顺延
   */
  function scheduleEncourage() {
    var after = (Number(t.encourageShowAfterMin) || 5) * 60;
    var before = (Number(t.encourageShowBeforeMin) || 15) * 60;
    var dur = (Number(t.encourageDurationMin) || 5) * 60;
    if (before < after) before = after;
    var maxTarget = Math.min(before, FOCUS_SEC - 60); // 至少留 1 分钟展示时间
    if (maxTarget < after) maxTarget = after;
    encourageTarget = after + Math.floor(Math.random() * (maxTarget - after + 1));
    encourageHideAt = encourageTarget + dur;
    encourageShown = false;
    hideBubble();
  }

  function showBubble() {
    var list = t.encouragementList || [];
    if (!list.length) return;
    bubbleText.textContent = list[Math.floor(Math.random() * list.length)];
    bubble.classList.remove('hide');
  }

  function hideBubble() {
    bubble.classList.add('hide');
  }

  /* ---------- 计时 ---------- */
  function startTicking() {
    stopTicking();
    tick = setInterval(function () {
      if (!running) return;
      elapsed++;
      remain--;

      /* 鼓励语触发与消失（仅在专注阶段） */
      if (phase === PHASE.FOCUS) {
        if (!encourageShown && elapsed >= encourageTarget) {
          encourageShown = true;
          showBubble();
        }
        if (encourageShown && elapsed >= encourageHideAt) {
          hideBubble();
        }
      }

      if (remain <= 0) {
        if (phase === PHASE.FOCUS) {
          /* 专注结束 -> 进入休息 */
          setPhase(PHASE.BREAK);
          elapsed = 0;
          hideBubble();
        } else {
          /* 休息结束 -> 回到待开始状态 */
          running = false;
          stopTicking();
          setPhase(PHASE.IDLE);
          startBtn.textContent = t.startButtonText;
        }
        return;
      }
      render();
    }, 1000);
  }

  function stopTicking() {
    if (tick) { clearInterval(tick); tick = null; }
  }

  /* ---------- 按钮 ---------- */
  startBtn.addEventListener('click', function () {
    if (phase === PHASE.IDLE) {
      /* 开始专注 */
      setPhase(PHASE.FOCUS);
      elapsed = 0;
      scheduleEncourage();
      running = true;
      startBtn.textContent = t.pauseButtonText;
      startTicking();
    } else if (running) {
      /* 暂停 */
      running = false;
      startBtn.textContent = t.startButtonText;
    } else {
      /* 继续 */
      running = true;
      startBtn.textContent = t.pauseButtonText;
    }
  });

  resetBtn.addEventListener('click', function () {
    running = false;
    stopTicking();
    hideBubble();
    setPhase(PHASE.IDLE);
    startBtn.textContent = t.startButtonText;
  });

  /* 初始渲染 */
  setPhase(PHASE.IDLE);

  /* 漂浮装饰 */
  var deco = document.getElementById('floatDeco');
  var symbols = ['⭐', '🍋', '📖', '✨'];
  for (var i = 0; i < 10; i++) {
    var s = document.createElement('span');
    s.textContent = symbols[i % symbols.length];
    s.style.left = (Math.random() * 100) + '%';
    s.style.fontSize = (12 + Math.random() * 14) + 'px';
    s.style.animationDuration = (10 + Math.random() * 14) + 's';
    s.style.animationDelay = (-Math.random() * 16) + 's';
    deco.appendChild(s);
  }
})();
</script>
</body>
</html>
